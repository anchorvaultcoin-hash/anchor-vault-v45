name: CI

# Запускается автоматически при каждом пуше в main и при pull request.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # 1) Забираем код вместе с библиотеками (lib/ как submodules)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2) Ставим Foundry (forge). На серверах GitHub интернет есть,
      #    поэтому компилятор solc 0.8.26 скачается сам через профиль default.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show forge version
        run: forge --version

      # 3) Сборка + печать размера байткода (контроль лимита EIP-170)
      - name: Build (with sizes)
        run: forge build --sizes

      # 4) Прогон всех тестов (юнит + инвариант). Красный = сборка падает.
      - name: Run tests
        run: forge test -vv
