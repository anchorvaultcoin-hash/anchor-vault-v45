name: DeepSeek Agent

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:

jobs:
  execute:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.title, 'DeepSeek') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Execute command from issue
        run: |
          echo "${{ github.event.issue.body }}" > command.sh
          bash command.sh
      - name: Commit results
        run: |
          git config user.name "DeepSeek Bot"
          git config user.email "deepseek@agent.local"
          git add -A
          git commit -m "DeepSeek: выполнена команда из issue" || true
          git push
